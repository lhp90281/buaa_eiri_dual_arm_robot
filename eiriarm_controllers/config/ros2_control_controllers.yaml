controller_manager:
  ros__parameters:
    update_rate: 500  # Hz - High-frequency control loop

    # List of controllers to load
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    gravity_compensation_controller:
      type: eiriarm_controllers/GravityCompensationController

    joint_impedance_controller:
      type: eiriarm_controllers/JointImpedanceControllerPlugin

    cartesian_position_controller:
      type: eiriarm_controllers/CartesianPositionControllerPlugin

# ============================================================================
# Gravity Compensation Controller Configuration
# ============================================================================
gravity_compensation_controller:
  ros__parameters:
    # List of joints to control (must match hardware interface)
    joints:
      - left_joint_0
      - left_joint_1
      - left_joint_2
      - left_joint_3
      - left_joint_4
      - left_joint_5
      - left_joint_6
      - right_joint_0
      - right_joint_1
      - right_joint_2
      - right_joint_3
      - right_joint_4
      - right_joint_5
      - right_joint_6

    # Maximum effort (Nm) - fallback if URDF doesn't specify
    max_effort: 50.0
    
    # Velocity filter alpha (same as impedance controller for consistency)
    velocity_filter_alpha: 0.98
    
    # Note: This controller applies ONLY gravity compensation (Kp=0, Kd=0)
    # Effort limits are automatically loaded from URDF

# ============================================================================
# Joint Impedance Controller Configuration
# ============================================================================
joint_impedance_controller:
  ros__parameters:
    # List of joints to control (must match hardware interface)
    joints:
      - left_joint_0
      - left_joint_1
      - left_joint_2
      - left_joint_3
      - left_joint_4
      - left_joint_5
      - left_joint_6
      - right_joint_0
      - right_joint_1
      - right_joint_2
      - right_joint_3
      - right_joint_4
      - right_joint_5
      - right_joint_6

    # Global default gains
    default_stiffness: 3.0   # Soft default for compliant behavior
    default_damping: 0.2     # Default damping

    # Safety limits
    max_effort: 40.0           # Global torque limit (Nm), per-joint limits from URDF
    position_error_limit: 0.3 # ~29 degrees, prevents violent snapback while allowing compliance
    velocity_filter_alpha: 0.0  # 95% history + 5% new: smooth damping, ~1.6Hz cutoff at 500Hz
    velocity_saturation: 3.5     # Max velocity error for damping (Kd*3 = max damping torque)

    # Per-joint gains (optional - override defaults)
    # Format: gains.<joint_name>.stiffness and gains.<joint_name>.damping
    
    # Per-joint gains - MUST satisfy: |gravity| + Kp*error_limit + Kd*vel_sat < effort_limit
    # Gravity budget: J0-1 ~20Nm, J2-3 ~10Nm, J4-6 ~3Nm
    # Remaining for impedance: J0-1 ~20Nm, J2-3 ~17Nm, J4-6 ~4Nm
    gains:
      left_joint_0:
        stiffness: 10.0   # Base (40Nm limit): 15*0.5=7.5 spring + 8*3=24 damp max
        damping: 2.0      # High damping for stability (near critical)
      left_joint_1:
        stiffness: 10.0   # Shoulder (40Nm limit)
        damping: 2.0
      left_joint_2:
        stiffness: 7.0   # Elbow (27Nm limit): 12*0.5=6 spring + 5*3=15 damp max
        damping: 1.0
      left_joint_3:
        stiffness: 7.0   # Forearm (27Nm limit)
        damping: 1.0
      left_joint_4:
        stiffness: 2.0    # Wrist (7Nm limit): 5*0.5=2.5 spring + 2*3=6 damp max
        damping: 0.2
      left_joint_5:
        stiffness: 2.0    # Wrist (7Nm limit)
        damping: 0.2
      left_joint_6:
        stiffness: 2.0    # Wrist (7Nm limit)
        damping: 0.2

      right_joint_0:
        stiffness: 10.0
        damping: 2.0
      right_joint_1:
        stiffness: 10.0
        damping: 2.0
      right_joint_2:
        stiffness: 7.0
        damping: 1.0
      right_joint_3:
        stiffness: 7.0
        damping: 1.0
      right_joint_4:
        stiffness: 2.0
        damping: 0.2
      right_joint_5:
        stiffness: 2.0
        damping: 0.2
      right_joint_6:
        stiffness: 2.0
        damping: 0.2

# ============================================================================
# Cartesian Position Controller Configuration
# ============================================================================
cartesian_position_controller:
  ros__parameters:
    joints:
      - left_joint_0
      - left_joint_1
      - left_joint_2
      - left_joint_3
      - left_joint_4
      - left_joint_5
      - left_joint_6
      - right_joint_0
      - right_joint_1
      - right_joint_2
      - right_joint_3
      - right_joint_4
      - right_joint_5
      - right_joint_6

    # End-effector frame names (from URDF link names)
    left_ee_frame: "left_link_7"
    right_ee_frame: "right_link_7"

    # IK solver parameters
    ik_max_iter: 100
    ik_eps: 1.0e-4
    ik_damping: 1.0e-3
    ik_dt: 1.0

    # Motion smoothing: max joint speed for interpolation (rad/s)
    position_interpolation_speed: 1.0

# ============================================================================
# Joint State Broadcaster Configuration
# ============================================================================
joint_state_broadcaster:
  ros__parameters: {}
