gripper_controller:
  ros__parameters:
    # Gripper joint names (only the actuated finger per gripper)
    left_finger_joint: "left_gripper_right_finger_joint"
    right_finger_joint: "right_gripper_right_finger_joint"

    # Topic configuration
    joint_state_topic: "/joint_states"
    effort_command_topic: "/ctrl/effort"

    # Position limits (meters) - safety backup for auto-stop
    position_open: 0.0
    position_close: 0.045

    # Desired speeds (m/s) - sent directly as ctrl to MuJoCo velocity actuator
    # MuJoCo computes: force = kv_mujoco * (ctrl - vel), kv_mujoco set in MJCF
    open_speed: 0.045     # Opening speed (m/s)
    close_speed: 0.045    # Closing speed (m/s)

    # HOLD mode: position → velocity P control
    # vel_cmd = kp_hold * (target_pos - pos), clamped to max_hold_vel
    kp_hold: 5.0          # Position→velocity gain (1/s) — low to avoid contact oscillation
    max_hold_vel: 0.1     # Max velocity command in HOLD mode (m/s)

    # Auto-stop: |force_sensor| > threshold → FORCE_HOLD
    force_threshold: 5.0       # Force (N) to trigger auto-stop
    grip_force: 5.0             # Target grip force in FORCE_HOLD (N)
    kp_force: 0.005             # Force→velocity P gain (m/s per N)
    ki_force: 0.02              # Force→velocity I gain (m/s per N·s)
    max_force_integral: 0.05    # Anti-windup clamp for integral term (m/s)
    force_delay_cycles: 50      # Grace period after move start (cycles @ 500Hz = 100ms)

    # Control loop rate (Hz)
    control_rate: 500.0
