# Joint-position gains for bilateral teleoperation.
#
# These profiles are read by dual_arm.launch.py and copied into
# joint_position_controller.kp_gains / kd_gains before the controller is
# loaded. They are not passed to ros2_control as parameters directly.
#
# slave keeps the current production gains. master is intentionally softer so
# the operator arm does not feel locked by tiny master/slave tracking errors.

joints:
  - left_joint_0
  - left_joint_1
  - left_joint_2
  - left_joint_3
  - left_joint_4
  - left_joint_5
  - left_joint_6
  - right_joint_0
  - right_joint_1
  - right_joint_2
  - right_joint_3
  - right_joint_4
  - right_joint_5
  - right_joint_6

profiles:
  slave:
    kp_gains:
      - 240.0
      - 240.0
      - 240.0
      - 240.0
      - 24.0
      - 31.0
      - 25.0
      - 240.0
      - 240.0
      - 240.0
      - 240.0
      - 24.0
      - 31.0
      - 25.0
    kd_gains:
      - 3.0
      - 3.0
      - 3.0
      - 3.0
      - 0.2
      - 0.2
      - 0.2
      - 3.0
      - 3.0
      - 3.0
      - 3.0
      - 0.2
      - 0.2
      - 0.2

  master:
    kp_gains:
      - 240.0
      - 240.0
      - 240.0
      - 240.0
      - 24.0
      - 31.0
      - 25.0
      - 240.0
      - 240.0
      - 240.0
      - 240.0
      - 24.0
      - 31.0
      - 25.0
    kd_gains:
      - 3.0
      - 3.0
      - 3.0
      - 3.0
      - 0.2
      - 0.2
      - 0.2
      - 3.0
      - 3.0
      - 3.0
      - 3.0
      - 0.2
      - 0.2
      - 0.2
